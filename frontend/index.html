<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"  href="./style.css" >
    <title>Document</title>
</head>
<body>
    <div class="main">
        <div class="header">
            <div class="app_name">SAMRAJ EDITOR</div>
            <input class="import_image" id="import_image" type="file">
            <button class="save" id="save">SAVE</button>
        </div>
        <div class="content">
            <div class="feature">

                <div class="brightness_control">
                    <label for="brightness">BRIGHTNESS</label>
                    <input
                        type="range"
                        id="brightness"
                        min="-100"
                        max="100"
                        value="0"
                    >
                    <span id="brightness_value">0</span>
                </div>
                <button class="filter" id="grayscale">GRAYSCALE</button>
                <button class="crop" id="crop" >CROP</button>
                <button class="resize">RESIZE</button>
                <button class="rotate">ROTATE</button>
                <div id="rotateControl" hidden>
                    <button id="rotateLeft">Rotate Left ↶</button>
                    <button id="rotateRight">Rotate Right ⤸</button>
                 </div>
                <button class="filter">FILTER</button>
                <button class="blur">BLUR</button>
                <button class="text">TEXT</button>
                <button class="add">ADD BACKGROUND</button>
                <button class="remove">REMOVE BACKGROUND</button>
            </div>
            <div class="image_preview" id="image_preview" >image  preview</div>
        </div>
        <div class="footer">
            <button class="undo">UNDO</button>
            <button class="redo">REDO</button>
            <button class="zoom">ZOOM</button>
            <button class="export">EXPORT</button>
        </div>
    </div>
    <script src="./app.js"></script>
    <script src="./rotation.js"></script>
</body>
</html>
