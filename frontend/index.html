<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"  href="./style.css" >
    <title>Document</title>
</head>
<body>
    <div class="main">
        <div class="header">
            <div class="app_name">SAMRAJ EDITOR</div>
            <input class="import_image" type="file">
            <button class="save">SAVE</button>
        </div>
        <div class="content">
            <div class="feature">
                <button class="crop">CROP</button>
                <button class="resize">RESIZE</button>
                <button class="rotate">ROTATE</button>
                <button class="filter">FILTER</button>
                <button class="blur">BLUR</button>
                <button class="text">TEXT</button>
                <button class="add">ADD BACKGROUND</button>
                <button class="remove">REMOVE BACKGROUND</button>
            </div>
            <div class="image_preview">image  preview</div>
        </div>
        <div class="footer">
            <button class="undo">UNDO</button>
            <button class="redo">REDO</button>
            <button class="zoom">ZOOM</button>
            <button class="export">EXPORT</button>
        </div>
    </div>
</body>
</html>
