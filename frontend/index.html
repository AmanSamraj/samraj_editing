<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Document</title>
</head>
<body>
    <div class="main">
        <div class="header">
            <div class="app_name">SAMRAJ EDITOR</div>
            <input class="import_image" id="import_image" type="file">
            <button class="save" id="save">SAVE</button>
        </div>
        <div class="content">
            <div class="feature">
                <div class="brightness_control">
                    <label for="brightness">BRIGHTNESS</label>
                    <input type="range" id="brightness" min="-100" max="100" value="0">
                    <span id="brightness_value">0</span>
                </div>
                <button class="filter" id="grayscale">GRAYSCALE</button>
                <button class="crop" id="crop">CROP</button>
                <button class="resize">RESIZE</button>
                <button class="rotate">ROTATE</button>
                <div id="rotateControl" hidden>
                    <button id="rotateLeft">Rotate Left â†¶</button>
                    <button id="rotateRight">Rotate Right â¤¸</button>
                </div>
                <button class="filter">FILTER</button>
                <button class="blur">BLUR</button>
                <button class="text">TEXT</button>
                <button>
                    <button class="add" id="add">ADD BACKGROUND</button>
                    <button class="remove" id="remove">REMOVE BACKGROUND</button>
                    <button class="replace" id="replace">REPLACE BACKGROUND</button>
                    <button class="add" id="add" type="button">ADD BACKGROUND</button>
                    <button class="remove" id="remove" type="button">REMOVE BACKGROUND</button>
                    <button class="replace" id="replace" type="button">REPLACE BACKGROUND</button>
                    <input type="color" id="background_color" value="#ffffff" title="Choose background color">
                    <input type="file" id="background_image" accept="image/*" hidden>
                    <input type="file" id="background_image" accept="image/*">
                </button>
            </div>
            <div class="image_preview" id="image_preview">image preview</div>
        </div>
        <div class="footer">
            <button class="undo">UNDO</button>
            <button class="redo">REDO</button>
            <button class="zoom">ZOOM</button>
            <button class="export">EXPORT</button>
        </div>
    </div>
    <script src="./app.js"></script>
    <script src="./rotation.js"></script>
    <script src="./bg.js"></script>
</body>
</html>
